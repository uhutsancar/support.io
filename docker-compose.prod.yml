services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-supportchat}
      POSTGRES_USER: ${DB_USER:-support_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-support_user} -d ${DB_NAME:-supportchat}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory ${REDIS_MAXMEMORY:-512mb} --maxmemory-policy allkeys-lru
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile.prod
      args:
        VITE_API_URL: ""
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-supportchat}
      DB_USER: ${DB_USER:-support_user}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      DB_SSL: "false"
      DB_POOL_MAX: ${DB_POOL_MAX:-20}
      DB_STATEMENT_TIMEOUT_MS: ${DB_STATEMENT_TIMEOUT_MS:-15000}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      CORS_ORIGINS: https://${APP_DOMAIN:?APP_DOMAIN is required}
      # Oturum httpOnly cerezde. Panel ile API ayni alan adinda (Caddy) oldugu
      # icin varsayilanlar dogru: SameSite=Lax, uretimde Secure. Panel baska
      # bir alan adindan sunulursa COOKIE_SAMESITE=none verin (Secure zorunlu
      # olur) ve CSRF cift gonderimi yine korumaya devam eder.
      COOKIE_SAMESITE: ${COOKIE_SAMESITE:-lax}
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-604800}
      # Hesap basina basarisiz giris siniri (15 dakikalik pencere).
      ACCOUNT_LOCK_MAX: ${ACCOUNT_LOCK_MAX:-10}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_REGION: ${AWS_REGION:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACL: ${S3_ACL:-}
      AI_ENABLED: ${AI_ENABLED:-false}
      AI_BASE_URL: ${AI_BASE_URL:-http://llm:8000/v1}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_TIMEOUT_MS: ${AI_TIMEOUT_MS:-20000}
      AI_CONCURRENCY: ${AI_CONCURRENCY:-2}
      AI_QUEUE_MAX_WAIT_MS: ${AI_QUEUE_MAX_WAIT_MS:-8000}
      AI_AUTO_REPLY_ENABLED: ${AI_AUTO_REPLY_ENABLED:-false}
      ORDER_LOOKUP_TIMEOUT_MS: ${ORDER_LOOKUP_TIMEOUT_MS:-3000}
      API_RATE_MAX: ${API_RATE_MAX:-3000}
      AUTH_RATE_MAX: ${AUTH_RATE_MAX:-100}
    expose:
      - "3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # The self-hosted model; see ai/README.md. Same settings as development,
  # with no published port: only the backend reaches it, on the compose
  # network. Started with the `ai` profile (COMPOSE_PROFILES=ai).
  llm:
    image: ${VLLM_IMAGE:-vllm/vllm-openai:v0.30.0@sha256:8a69ffad015f138d7170c4ddc429e230a3bc1c1719f67e14324749df200a4b90}
    profiles: [ai]
    restart: unless-stopped
    entrypoint:
      - /bin/sh
      - -c
      - 'if [ $${#VLLM_API_KEY} -lt 32 ]; then echo "AI_API_KEY must be at least 32 characters" >&2; exit 1; fi; exec vllm serve "$$@"'
      - --
    environment:
      VLLM_API_KEY: ${AI_API_KEY:-}
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      VLLM_NO_USAGE_STATS: "1"
      DO_NOT_TRACK: "1"
    command:
      - /models/${AI_MODEL:-unset}
      - --served-model-name
      - ${AI_MODEL:-unset}
      - --quantization
      - bitsandbytes
      - --dtype
      - bfloat16
      - --max-model-len
      - "4096"
      - --max-num-seqs
      - "4"
      - --gpu-memory-utilization
      - "0.85"
      - --limit-mm-per-prompt
      - '{"image": 0}'
      - --generation-config
      - vllm
    volumes:
      - supportio_models:/models:ro
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10m

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?APP_DOMAIN is required}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile.prod:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy

volumes:
  supportio_models:
  postgres_prod_data:
  redis_prod_data:
  caddy_data:
  caddy_config:
