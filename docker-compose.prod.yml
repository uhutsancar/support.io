# Production stack (plan §13.4): Cloudflare -> Caddy :443 -> backend:3000,
# PostgreSQL and Redis reachable only on the Docker network.
#
# The backend runs a prebuilt image named by APP_IMAGE
# (ghcr.io/<owner>/supportio:sha-xxxxxxx, built by .github/workflows/release.yml).
# Nothing is built on the server; scripts/deploy.sh switches APP_IMAGE,
# runs the migrations once and restarts. For a local production simulation
# add docker-compose.prod.build.yml, which builds the image here.
#
# Never add `ports:` to postgres or redis: published ports bypass UFW.
#
# Every third-party image is pinned by digest (plan v10 SUP-02); Dependabot
# proposes new digests weekly and the release workflow scans them (Trivy).
# Each service drops the Linux capabilities it does not need and cannot gain
# new privileges (SEC-14). The memory and CPU ceilings are starting values for
# a 2 vCPU / 4 GB server; adjust them from the staging measurements.

x-logging: &logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

x-hardening: &hardening
  security_opt:
    - no-new-privileges:true

services:
  postgres:
    # PostgreSQL 16 with WAL-G (docker/postgres, DR-02), built and signed by the
    # release workflow; its summary prints the reference to put here.
    image: ${POSTGRES_IMAGE:?POSTGRES_IMAGE is required, e.g. ghcr.io/<owner>/supportio-postgres:16.15-walg-3.0.9@sha256:...}
    restart: unless-stopped
    <<: *hardening
    # The entrypoint starts as root, fixes the data directory's owner and
    # drops to the postgres user; that is all it needs.
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    shm_size: 256mb
    # Sized for a 4 GB server where the database gets about 1 GB (PERF-03).
    # log_parameter_max_length=0 keeps bind values (message text, e-mail
    # addresses) out of the slow-query log. pg_stat_statements is loaded so
    # the slowest queries can be read on staging:
    #   CREATE EXTENSION IF NOT EXISTS pg_stat_statements;
    command: >-
      postgres
      -c shared_buffers=${PG_SHARED_BUFFERS:-512MB}
      -c effective_cache_size=${PG_EFFECTIVE_CACHE_SIZE:-1536MB}
      -c work_mem=8MB
      -c maintenance_work_mem=128MB
      -c max_connections=${PG_MAX_CONNECTIONS:-50}
      -c random_page_cost=1.1
      -c log_min_duration_statement=500ms
      -c log_parameter_max_length=0
      -c idle_in_transaction_session_timeout=60s
      -c autovacuum_vacuum_scale_factor=0.05
      -c shared_preload_libraries=pg_stat_statements
      -c pg_stat_statements.track=all
      -c archive_mode=${PG_ARCHIVE_MODE:-off}
      -c "archive_command=wal-g wal-push %p"
      -c archive_timeout=300
    environment:
      POSTGRES_DB: ${DB_NAME:-supportchat}
      POSTGRES_USER: ${DB_USER:-support_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      # WAL-G (DR-02): continuous archive to its own bucket, encrypted. Used
      # only with PG_ARCHIVE_MODE=on; docs/disaster-recovery.md.
      WALG_S3_PREFIX: ${WALG_S3_PREFIX:-}
      AWS_ACCESS_KEY_ID: ${WALG_AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${WALG_AWS_SECRET_ACCESS_KEY:-}
      AWS_ENDPOINT: ${WALG_AWS_ENDPOINT:-}
      AWS_REGION: ${WALG_AWS_REGION:-auto}
      AWS_S3_FORCE_PATH_STYLE: "true"
      WALG_LIBSODIUM_KEY: ${WALG_LIBSODIUM_KEY:-}
      WALG_LIBSODIUM_KEY_TRANSFORM: hex
      WALG_COMPRESSION_METHOD: lz4
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-support_user} -d ${DB_NAME:-supportchat}"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: ${POSTGRES_MEM_LIMIT:-1280m}
    logging: *logging

  redis:
    image: redis:7.4.11-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    restart: unless-stopped
    <<: *hardening
    cap_drop: [ALL]
    cap_add: [CHOWN, SETGID, SETUID]
    # Redis carries only the Socket.IO adapter, rate limits, presence and short
    # budgets; every message lives in PostgreSQL. Nothing here needs to
    # survive a restart, so persistence is off and there is no volume. If
    # durable data is ever put in Redis, revisit this (and the runbook).
    #
    # Only the Docker network reaches it, and it still asks for a password
    # (SEC-12): a compromised neighbour container cannot read rate-limit or
    # presence keys, and FLUSHALL / CONFIG are switched off outright.
    # REDIS_PASSWORD goes into a URL, so keep it to [A-Za-z0-9]
    # (openssl rand -hex 24).
    command: >-
      redis-server --appendonly no --save ""
      --maxmemory ${REDIS_MAXMEMORY:-256mb} --maxmemory-policy volatile-lru
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      --protected-mode yes
      --rename-command FLUSHALL ""
      --rename-command FLUSHDB ""
      --rename-command CONFIG ""
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          memory: ${REDIS_MEM_LIMIT:-320m}
    logging: *logging

  backend:
    image: ${APP_IMAGE:?APP_IMAGE is required, e.g. ghcr.io/uhutsancar/supportio:sha-0000000}
    restart: unless-stopped
    <<: *hardening
    # Nothing in the image is written at runtime except uploads (a volume,
    # local storage only) and temporary files.
    read_only: true
    tmpfs:
      - /tmp:size=64m
    cap_drop: [ALL]
    environment:
      NODE_ENV: production
      PORT: 3000
      # Migrations run once per deploy (scripts/deploy.sh), not on every boot.
      MIGRATE_ON_BOOT: "false"
      APP_BASE_URL: https://${APP_DOMAIN:?APP_DOMAIN is required}
      CORS_ORIGINS: https://${APP_DOMAIN}
      # /.well-known/security.txt (SEC-10).
      SECURITY_CONTACT_EMAIL: ${SECURITY_CONTACT_EMAIL:-}
      SECURITY_TXT_EXPIRES: ${SECURITY_TXT_EXPIRES:-}
      # Staging: robots.txt and every page say noindex (MKT-02).
      SITE_NOINDEX: ${SITE_NOINDEX:-false}
      # Bot check on sign-up (SEC-06).
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
      TURNSTILE_SECRET: ${TURNSTILE_SECRET:-}
      # Self-hosted, cookieless visitor counts on the public pages (KARAR-MKT-3).
      ANALYTICS_SCRIPT_URL: ${ANALYTICS_SCRIPT_URL:-}
      ANALYTICS_WEBSITE_ID: ${ANALYTICS_WEBSITE_ID:-}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-supportchat}
      DB_USER: ${DB_USER:-support_user}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      DB_SSL: "false"
      DB_POOL_MAX: ${DB_POOL_MAX:-20}
      DB_STATEMENT_TIMEOUT_MS: ${DB_STATEMENT_TIMEOUT_MS:-15000}
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      # Only while rotating JWT_SECRET (runbook §8): the old value, still trusted
      # for checking what it signed and sealed.
      JWT_SECRET_PREVIOUS: ${JWT_SECRET_PREVIOUS:-}
      # Session cookie: panel and API share the origin, so Lax + Secure.
      COOKIE_SAMESITE: ${COOKIE_SAMESITE:-lax}
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-604800}
      ACCOUNT_LOCK_MAX: ${ACCOUNT_LOCK_MAX:-10}
      API_RATE_MAX: ${API_RATE_MAX:-3000}
      AUTH_RATE_MAX: ${AUTH_RATE_MAX:-100}
      SHUTDOWN_GRACE_MS: ${SHUTDOWN_GRACE_MS:-10000}
      # E-mail (verification, password reset, invitations, quota warnings).
      MAIL_PROVIDER: ${MAIL_PROVIDER:-smtp}
      MAIL_FROM: ${MAIL_FROM:?MAIL_FROM is required}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      # Staging only: mail goes to these domains alone (INF-03).
      MAIL_ALLOWLIST_DOMAINS: ${MAIL_ALLOWLIST_DOMAINS:-}
      # File uploads: S3-compatible storage (AWS S3, Cloudflare R2, Hetzner).
      UPLOAD_STORAGE: ${UPLOAD_STORAGE:-s3}
      # local is refused unless this says so (the volume is not backed up).
      ALLOW_LOCAL_UPLOADS: ${ALLOW_LOCAL_UPLOADS:-false}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:-}
      S3_ACL: ${S3_ACL:-}
      ALLOW_ARCHIVE_UPLOADS: ${ALLOW_ARCHIVE_UPLOADS:-false}
      AWS_REGION: ${AWS_REGION:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      # AI assistant. Empty key: the assistant is off, live chat is not.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
      GEMINI_RPM: ${GEMINI_RPM:-10}
      GEMINI_RPD: ${GEMINI_RPD:-900}
      GEMINI_TIER: ${GEMINI_TIER:-free}
      GEMINI_COST_PER_ANSWER: ${GEMINI_COST_PER_ANSWER:-}
      ASSISTANT_KILL_SWITCH: ${ASSISTANT_KILL_SWITCH:-false}
      # Push notifications to the panel (PRD-09); empty keys turn push off.
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      # Sign-in with Google (PRD-14): the OAuth client [SAHİP]; empty = no button.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      # Error tracking (OBS-01); empty DSN sends nothing.
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
      WIDGET_TELEMETRY_SAMPLE: ${WIDGET_TELEMETRY_SAMPLE:-0.1}
      # /internal/metrics (OBS-03): optional bearer token; the backup time
      # scripts/backup-postgres.sh writes.
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      OPS_REPORT_EMAIL: ${OPS_REPORT_EMAIL:-}
      # Caddy compresses (encode zstd gzip); doing it here too only costs CPU.
      HTTP_COMPRESSION: "off"
      BACKUP_STATUS_FILE: /run/supportio-status/backup-last-success
      # Paddle. The boot check refuses BILLING_ENABLED=true without the rest.
      BILLING_ENABLED: ${BILLING_ENABLED:-false}
      PADDLE_ENV: ${PADDLE_ENV:-sandbox}
      PADDLE_API_KEY: ${PADDLE_API_KEY:-}
      PADDLE_WEBHOOK_SECRET: ${PADDLE_WEBHOOK_SECRET:-}
      PADDLE_CLIENT_TOKEN: ${PADDLE_CLIENT_TOKEN:-}
      PADDLE_PRICE_PRO: ${PADDLE_PRICE_PRO:-}
      PADDLE_PRICE_PRO_YEARLY: ${PADDLE_PRICE_PRO_YEARLY:-}
      PADDLE_PRICE_ENTERPRISE: ${PADDLE_PRICE_ENTERPRISE:-}
      PADDLE_PRICE_ENTERPRISE_YEARLY: ${PADDLE_PRICE_ENTERPRISE_YEARLY:-}
      BILLING_PAST_DUE_GRACE_DAYS: ${BILLING_PAST_DUE_GRACE_DAYS:-7}
    volumes:
      # Used only with UPLOAD_STORAGE=local (plan §12, decision B); then it
      # must be in the backups too.
      - uploads_data:/app/backend/uploads
      # The time of the last successful backup (scripts/backup-postgres.sh).
      - /var/lib/supportio/status:/run/supportio-status:ro
    expose:
      - "3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    stop_grace_period: 15s
    deploy:
      resources:
        limits:
          memory: ${BACKEND_MEM_LIMIT:-1536m}
          cpus: ${BACKEND_CPUS:-1.5}
    logging: *logging

  proxy:
    image: caddy:2.11.7-alpine@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f
    restart: unless-stopped
    <<: *hardening
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?APP_DOMAIN is required}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile.prod:/etc/caddy/Caddyfile:ro
      # Optional Cloudflare Origin CA certificate (runbook §2, SEC-13).
      - ./caddy/tls.d:/etc/caddy/tls.d:ro
      - ./caddy/site.d:/etc/caddy/site.d:ro
      - ./caddy/origin:/etc/caddy/origin:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: ${CADDY_MEM_LIMIT:-256m}
    logging: *logging

volumes:
  postgres_prod_data:
  uploads_data:
  caddy_data:
  caddy_config:
