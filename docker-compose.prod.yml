services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-supportchat}
      POSTGRES_USER: ${DB_USER:-support_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-support_user} -d ${DB_NAME:-supportchat}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory ${REDIS_MAXMEMORY:-512mb} --maxmemory-policy allkeys-lru
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile.prod
      args:
        VITE_API_URL: ""
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-supportchat}
      DB_USER: ${DB_USER:-support_user}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      DB_SSL: "false"
      DB_POOL_MAX: ${DB_POOL_MAX:-20}
      DB_STATEMENT_TIMEOUT_MS: ${DB_STATEMENT_TIMEOUT_MS:-15000}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      CORS_ORIGINS: https://${APP_DOMAIN:?APP_DOMAIN is required}
      # Oturum httpOnly cerezde. Panel ile API ayni alan adinda (Caddy) oldugu
      # icin varsayilanlar dogru: SameSite=Lax, uretimde Secure. Panel baska
      # bir alan adindan sunulursa COOKIE_SAMESITE=none verin (Secure zorunlu
      # olur) ve CSRF cift gonderimi yine korumaya devam eder.
      COOKIE_SAMESITE: ${COOKIE_SAMESITE:-lax}
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-604800}
      # Hesap basina basarisiz giris siniri (15 dakikalik pencere).
      ACCOUNT_LOCK_MAX: ${ACCOUNT_LOCK_MAX:-10}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_REGION: ${AWS_REGION:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACL: ${S3_ACL:-}
      AI_ENABLED: ${AI_ENABLED:-false}
      AI_BASE_URL: ${AI_BASE_URL:-http://llm:8000/v1}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_TIMEOUT_MS: ${AI_TIMEOUT_MS:-20000}
      AI_CONCURRENCY: ${AI_CONCURRENCY:-2}
      AI_QUEUE_MAX_WAIT_MS: ${AI_QUEUE_MAX_WAIT_MS:-8000}
      AI_AUTO_REPLY_ENABLED: ${AI_AUTO_REPLY_ENABLED:-false}
      API_RATE_MAX: ${API_RATE_MAX:-3000}
      AUTH_RATE_MAX: ${AUTH_RATE_MAX:-100}
    expose:
      - "3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?APP_DOMAIN is required}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile.prod:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_prod_data:
  redis_prod_data:
  caddy_data:
  caddy_config:
