# The production image (plan §14.2): built from main and from v* tags,
# pushed to GHCR as ghcr.io/<owner>/supportio:sha-<7 chars> and, for a tag,
# :vX.Y.Z. There is no `latest`: a deployment always names the exact image
# (scripts/deploy.sh), so a rollback is the previous tag.
name: Release image

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/supportio
          flavor: latest=false
          tags: |
            type=sha,prefix=sha-,format=short
            type=semver,pattern=v{{version}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile.prod
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_SUPPORT_SITE_KEY=${{ vars.SUPPORT_SITE_KEY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Image reference for the deploy
        run: echo "Deploy with ./scripts/deploy.sh ghcr.io/${{ github.repository_owner }}/supportio:sha-${GITHUB_SHA::7}" >> "$GITHUB_STEP_SUMMARY"
