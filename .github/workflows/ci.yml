# Every push and pull request (plan §14.1).
#
#   checks    typecheck, lint and formatting for both packages, plus two
#             guards: no trace of the removed self-hosted AI stack, and no
#             fixed server address baked into the panel build
#   test      the backend e2e suite against a real PostgreSQL and Redis,
#             with the API running beside it as in development
#   build     both packages, then the production image (not pushed)
#   secrets   gitleaks over the history
name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22.23'

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            admin-panel/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: npm ci
        working-directory: admin-panel
      - name: Backend typecheck + lint
        run: npm run check
        working-directory: backend
      - name: Panel typecheck + lint
        run: npm run check
        working-directory: admin-panel
      - name: Formatting
        run: |
          (cd backend && npm run format:check)
          (cd admin-panel && npm run format:check)
      - name: No trace of the removed self-hosted AI stack
        # The FAQ assistant (Google Gemini, backend/src/services/assistant)
        # is the only AI. The old model server, its compose service and its
        # providers must not come back. Migrations and the generated schema
        # are history and may name what they removed.
        run: |
          if grep -rniE 'vllm|ollama|trendyol|openai|anthropic|AI_SERVICE_URL|LLM_(URL|MODEL)|order[_-]?lookup' \
              --include='*.ts' --include='*.tsx' --include='*.yml' --include='*.yaml' --include='*.json' --include='Dockerfile*' \
              --exclude-dir=node_modules --exclude-dir=dist --exclude-dir=migrations --exclude-dir=.github \
              --exclude=schema.sql --exclude=package-lock.json . ; then
            echo "::error::A removed AI component is referenced again"
            exit 1
          fi

  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: supportchat
          POSTGRES_USER: support_user
          POSTGRES_PASSWORD: supportchat
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U support_user -d supportchat"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      NODE_ENV: development
      PORT: '5000'
      DATABASE_URL: postgresql://support_user:supportchat@localhost:5432/supportchat
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-only-secret-that-is-long-enough-for-the-checks
      MAIL_PROVIDER: console
      APP_BASE_URL: http://localhost:5000
      E2E_BASE_URL: http://localhost:5000
      # The suite is many tenants in a few minutes; production keeps the strict limits.
      REGISTER_RATE_MAX: '100000'
      AUTH_RATE_MAX: '100000'
      API_RATE_MAX: '1000000'
      # Sandbox-shaped Paddle values the suite signs webhooks with.
      PADDLE_ENV: sandbox
      PADDLE_WEBHOOK_SECRET: ci-paddle-webhook-secret
      PADDLE_PRICE_PRO: pri_ci_pro
      PADDLE_PRICE_ENTERPRISE: pri_ci_enterprise
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - name: Start the API
        working-directory: backend
        run: |
          npm run build:widget
          nohup npx tsx src/server.ts > /tmp/api.log 2>&1 &
          for i in $(seq 1 60); do
            curl -fs http://localhost:5000/ready && exit 0
            sleep 2
          done
          cat /tmp/api.log
          exit 1
      - name: e2e suite
        run: npm test
        working-directory: backend
      - name: API log
        if: failure()
        run: cat /tmp/api.log

  build:
    runs-on: ubuntu-24.04
    needs: [checks]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            admin-panel/package-lock.json
      - run: npm ci && npm run build
        working-directory: backend
      - run: npm ci && npm run build
        working-directory: admin-panel
      - name: No fixed server address in the panel build
        run: |
          if grep -rEo 'https?://([0-9]{1,3}\.){3}[0-9]{1,3}' admin-panel/dist; then
            echo "::error::admin-panel/dist contains a hard-coded IP address"
            exit 1
          fi
      - uses: docker/setup-buildx-action@v3
      - name: Production image builds
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile.prod
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
