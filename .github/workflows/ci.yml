# Every push and pull request (plan §14.1, v10 SEC-02 / SUP-03 / PERF-01).
#
#   checks    typecheck, lint and formatting for both packages, the
#             production dependency audit, and two guards: no trace of the
#             removed self-hosted AI stack, and no fixed server address
#             baked into the panel build
#   test      the backend e2e suite against a real PostgreSQL and Redis,
#             with the API running beside it as in development
#   browser   Playwright against the built panel served by the API
#   build     both packages, the size budgets, then the production image
#             (not pushed) and its vulnerability scan
#   secrets   gitleaks over the history
#
# Every action is pinned to a commit SHA (the tag is in the comment);
# Dependabot keeps them current.
name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22.23'

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            admin-panel/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: npm ci
        working-directory: admin-panel
      - name: Backend typecheck + lint
        run: npm run check
        working-directory: backend
      - name: Panel typecheck + lint
        run: npm run check
        working-directory: admin-panel
      - name: Formatting
        run: |
          (cd backend && npm run format:check)
          (cd admin-panel && npm run format:check)
      - name: The generated schema matches the migrations
        run: npm run db:schema -- --check
        working-directory: backend
      - name: Translations have the same keys in Turkish and English
        run: npx tsx scripts/check-locales.ts
        working-directory: admin-panel
      - name: No text written into components (UX-06)
        run: npx tsx scripts/check-hardcoded-text.ts
        working-directory: admin-panel
      - name: Production dependencies have no high or critical advisory
        # Development-only tooling is reported in docs/security/accepted-risks.md;
        # what ships in the image must be clean.
        run: |
          (cd backend && npm audit --omit=dev --audit-level=high)
          (cd admin-panel && npm audit --omit=dev --audit-level=high)
      - name: No trace of the removed self-hosted AI stack
        # The FAQ assistant (Google Gemini, backend/src/services/assistant)
        # is the only AI. The old model server, its compose service and its
        # providers must not come back. Migrations and the generated schema
        # are history and may name what they removed.
        run: |
          if grep -rniE 'vllm|ollama|trendyol|openai|anthropic|AI_SERVICE_URL|LLM_(URL|MODEL)|order[_-]?lookup' \
              --include='*.ts' --include='*.tsx' --include='*.yml' --include='*.yaml' --include='*.json' --include='Dockerfile*' \
              --exclude-dir=node_modules --exclude-dir=dist --exclude-dir=migrations --exclude-dir=.github \
              --exclude=schema.sql --exclude=package-lock.json . ; then
            echo "::error::A removed AI component is referenced again"
            exit 1
          fi

  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        # The base of docker/postgres and of the development stack (DR-02).
        image: postgres:16.15-trixie@sha256:65b16a8b326e0cfbdf33fa7e783f2a0cb352a61448616ccccfd616ef42aa0f65
        env:
          POSTGRES_DB: supportchat
          POSTGRES_USER: support_user
          POSTGRES_PASSWORD: supportchat
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U support_user -d supportchat"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7.4.11-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      NODE_ENV: development
      PORT: '5000'
      DATABASE_URL: postgresql://support_user:supportchat@localhost:5432/supportchat
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-only-secret-that-is-long-enough-for-the-checks
      MAIL_PROVIDER: console
      APP_BASE_URL: http://localhost:5000
      E2E_BASE_URL: http://localhost:5000
      # The suite is many tenants in a few minutes; production keeps the strict limits.
      REGISTER_RATE_MAX: '100000'
      AUTH_RATE_MAX: '100000'
      API_RATE_MAX: '1000000'
      # Sandbox-shaped Paddle values the suite signs webhooks with.
      PADDLE_ENV: sandbox
      PADDLE_WEBHOOK_SECRET: ci-paddle-webhook-secret
      PADDLE_PRICE_PRO: pri_ci_pro
      PADDLE_PRICE_ENTERPRISE: pri_ci_enterprise
      # Pushes, and Slack/Telegram/webhook calls, are recorded by the API,
      # never sent anywhere.
      PUSH_TRANSPORT: memory
      INTEGRATION_TRANSPORT: memory
      # Sign-in with Google goes to the API's stand-in account chooser.
      GOOGLE_SIGN_IN_TRANSPORT: memory
      # Knowledge pages are served by the API's stand-in, not fetched.
      KNOWLEDGE_TRANSPORT: memory
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - name: A throw-away Web Push key pair for this run (PRD-09)
        # Generated here so no private key sits in the repository.
        working-directory: backend
        run: node -e "const k=require('web-push').generateVAPIDKeys();console.log('VAPID_PUBLIC_KEY='+k.publicKey);console.log('VAPID_PRIVATE_KEY='+k.privateKey)" >> "$GITHUB_ENV"
      - name: Start the API, recording coverage
        # The suite calls a running API: the code it exercises runs there.
        # scripts/coverage-api.ts exits cleanly on a stop file, so V8 writes
        # what ran (TST-02).
        working-directory: backend
        run: |
          npm run build:widget
          NODE_V8_COVERAGE=/tmp/v8 COVERAGE_STOP_FILE=/tmp/stop-api \
            nohup node --import tsx scripts/coverage-api.ts > /tmp/api.log 2>&1 &
          for i in $(seq 1 60); do
            curl -fs http://localhost:5000/ready && exit 0
            sleep 2
          done
          cat /tmp/api.log
          exit 1
      - name: e2e suite
        run: NODE_V8_COVERAGE=/tmp/v8 node --import tsx --test --test-reporter=spec "tests/**/*.test.ts"
        working-directory: backend
      - name: Coverage of the API and the suite together
        # Visibility, not a gate: the security and billing modules aim at 80 %
        # (scripts/coverage-summary.ts marks those under it).
        if: always()
        working-directory: backend
        run: |
          touch /tmp/stop-api
          for i in $(seq 1 30); do curl -fs http://localhost:5000/ready > /dev/null || break; sleep 1; done
          sleep 3
          npx c8 report --temp-directory /tmp/v8 --src src --include 'src/**' --exclude 'src/widget/**' \
            --exclude-after-remap --reporter=lcov --reporter=json-summary --reporter=text-summary \
            --report-dir coverage
          npx tsx scripts/coverage-summary.ts coverage/coverage-summary.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage
          retention-days: 14
      - name: API log
        if: failure()
        run: cat /tmp/api.log

  # Playwright against the built panel served by the API (e2e/tests).
  browser:
    runs-on: ubuntu-24.04
    needs: [checks]
    services:
      postgres:
        # The base of docker/postgres and of the development stack (DR-02).
        image: postgres:16.15-trixie@sha256:65b16a8b326e0cfbdf33fa7e783f2a0cb352a61448616ccccfd616ef42aa0f65
        env:
          POSTGRES_DB: supportchat
          POSTGRES_USER: support_user
          POSTGRES_PASSWORD: supportchat
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U support_user -d supportchat"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7.4.11-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      NODE_ENV: development
      PORT: '5000'
      DATABASE_URL: postgresql://support_user:supportchat@localhost:5432/supportchat
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-only-secret-that-is-long-enough-for-the-checks
      MAIL_PROVIDER: console
      APP_BASE_URL: http://localhost:5000
      E2E_APP_URL: http://localhost:5000
      REGISTER_RATE_MAX: '100000'
      AUTH_RATE_MAX: '100000'
      API_RATE_MAX: '1000000'
      PADDLE_ENV: sandbox
      PADDLE_WEBHOOK_SECRET: ci-paddle-webhook-secret
      PADDLE_PRICE_PRO: pri_ci_pro
      PADDLE_PRICE_ENTERPRISE: pri_ci_enterprise
      # The AI model is the stand-in in e2e/fake-gemini.mjs: no real key, no
      # request leaves the runner (TST-01 #2).
      GEMINI_API_KEY: test-key-not-a-real-one
      GEMINI_BASE_URL: http://127.0.0.1:5199/v1beta
      E2E_FAKE_GEMINI: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            admin-panel/package-lock.json
            e2e/package-lock.json
      - run: npm ci && npm run build
        working-directory: admin-panel
      - run: npm ci
        working-directory: backend
      # Chromium for desktop Chrome and the Pixel 7, WebKit for the iPhone,
      # iPad and desktop Safari, Firefox for desktop Firefox (UX-03).
      - run: npm ci && npx playwright install --with-deps chromium webkit firefox
        working-directory: e2e
      - name: Start the stand-in AI model
        run: nohup node e2e/fake-gemini.mjs 5199 > /tmp/fake-gemini.log 2>&1 &
      - name: Start the API
        working-directory: backend
        run: |
          npm run build:widget
          nohup npx tsx src/server.ts > /tmp/api.log 2>&1 &
          for i in $(seq 1 60); do
            curl -fs http://localhost:5000/ready && exit 0
            sleep 2
          done
          cat /tmp/api.log
          exit 1
      - name: Browser tests
        run: npm test
        working-directory: e2e
      - name: Lighthouse on the marketing pages
        # Plan v10 PERF-08: accessibility, SEO and layout shift must hold;
        # performance (target 90 on mobile) and LCP are reported, not gated.
        run: npx --yes @lhci/cli@0.15.1 autorun --config=lighthouserc.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: lighthouse
          path: lhci
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7
      - name: API log
        if: failure()
        run: cat /tmp/api.log

  build:
    runs-on: ubuntu-24.04
    needs: [checks]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            admin-panel/package-lock.json
      - run: npm ci && npm run build
        working-directory: backend
      - run: npm ci && npm run build
        working-directory: admin-panel
      - name: No fixed server address in the panel build
        run: |
          if grep -rEo 'https?://([0-9]{1,3}\.){3}[0-9]{1,3}' admin-panel/dist; then
            echo "::error::admin-panel/dist contains a hard-coded IP address"
            exit 1
          fi
      - name: Size budgets (widget and the panel's first load)
        run: node scripts/check-bundle-size.mjs
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Production image builds
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: backend/Dockerfile.prod
          push: false
          load: true
          tags: supportio:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Image has no fixable high or critical vulnerability
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: supportio:ci
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          trivyignores: .trivyignore
          exit-code: '1'

  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
