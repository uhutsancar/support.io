<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!--
      İkonlar. Eskiden burada `/src/public/support.io.webp` yazıyordu: bu yol
      kaynak ağacına işaret eder, `vite build` çıktısında böyle bir dosya
      olmadığı için üretimde favicon 404 dönüyordu. Artık tüm ikonlar
      `public/` altındadır ve `npm run icons` ile üretilir.
    -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <meta name="description" content="Support.io — modern müşteri destek ve canlı sohbet platformu. Tek satır kodla sitenize ekleyin, ziyaretçilerinizle gerçek zamanlı konuşun." />
    <meta name="keywords" content="canlı destek, canlı sohbet, chat widget, müşteri desteği, live chat, customer support" />
    <meta name="author" content="Support.io" />

    <!--
      Tema rengi açık/koyu için ayrı verilir; tek bir indigo değeri koyu temada
      tarayıcı çubuğunu marka renginde bırakıp arayüzle uyumsuzlaşıyordu.
    -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0B0D17" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Support.io" />
    <meta property="og:title" content="Support.io — Modern Müşteri Destek Sistemi" />
    <meta property="og:description" content="Tek satır kodla sitenize ekleyin. React, Next.js, Vue, WordPress ve daha fazlası için aynı embed." />
    <meta property="og:image" content="/og-image.svg" />
    <meta property="og:locale" content="tr_TR" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Support.io — Modern Müşteri Destek Sistemi" />
    <meta name="twitter:description" content="Tek satır kodla sitenize ekleyin. Gerçek zamanlı canlı destek." />
    <meta name="twitter:image" content="/og-image.svg" />

    <!--
      JSON-LD'den `aggregateRating` KALDIRILDI. Orada "4.8 / 127 değerlendirme"
      yazıyordu; böyle bir veri yok. Uydurma yapısal veri hem yanıltıcıdır hem
      de Google tarafından manuel işlem sebebidir.
    -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "Support.io",
      "applicationCategory": "BusinessApplication",
      "operatingSystem": "Web",
      "description": "Modern müşteri destek ve canlı sohbet çözümü"
    }
    </script>

    <title>Support.io — Canlı Destek Platformu</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
