# Development stack.
#
# Production is deliberately not described here: the admin service runs the Vite
# dev server with the source bind-mounted, which is a development-only setup.
#
# Host ports are all overridable, because a workstation that already runs
# PostgreSQL on 5432 or an API on 5000 cannot start this stack otherwise:
#
#   POSTGRES_PORT=5433 BACKEND_PORT=5001 docker compose up
#
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${DB_NAME:-supportchat}
      POSTGRES_USER: ${DB_USER:-support_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-supportchat}
    # Yalnizca bu makineden erisilir. Tum arayuzlere acik oldugunda varsayilan
    # parolayla birlikte ayni agdaki (ortak Wi-Fi vb.) herkes gelistirme
    # veritabanina baglanabiliyordu. Testler ve araclar localhost uzerinden
    # baglandigi icin hicbir sey degismez; Redis de ayni sekilde bagli.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-support_user} -d ${DB_NAME:-supportchat}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Bu projeye ait, digerlerinden bagimsiz Redis.
  #
  # Makinede baska redis'ler var (local-redis 6379, motionmeet-redis 6380), bu
  # yuzden hem konteyner adi hem host portu ayri tutulur. Yalnizca 127.0.0.1'e
  # baglanir: redis kimlik dogrulamasi olmadan calisir ve tum arayuzlere acilmasi
  # ag uzerinden acik bir kapi birakir.
  redis:
    image: redis:7-alpine
    container_name: support.io_redis
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --maxmemory ${REDIS_MAXMEMORY:-256mb}
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:${REDIS_PORT:-6381}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    # postgres is already gated by a healthcheck below, so the wait loop only
    # covers the gap between "accepting connections" and "ready".
    # npm run dev builds the widget runtime and then starts nodemon, which
    # runs the server through tsx. Polling (legacyWatch) is set in
    # backend/nodemon.json: on a Windows bind mount the host's filesystem
    # events never reach the container, so the watcher would otherwise sit idle.
    command: sh -c "until nc -z postgres 5432; do echo waiting for postgres; sleep 1; done; npm run dev"
    working_dir: /usr/src/backend
    volumes:
      - ./backend:/usr/src/backend
      - backend_node_modules:/usr/src/backend/node_modules
      # server.ts /demo'yu ../../demo yolundan sunar; bu klasor backend build
      # context'inin disindadir, yani imajda yoktur. Baglanmazsa /demo 404 doner.
      - ./demo:/usr/src/demo:ro
    environment:
      - PORT=3000
      - NODE_ENV=development
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-supportchat}
      - DB_USER=${DB_USER:-support_user}
      - DB_PASSWORD=${DB_PASSWORD:-supportchat}
      - DB_SSL=false
      # backend/.env icindeki DATABASE_URL localhost'u gosterir; konteyner
      # icinde bu yanlis olur. Bos birakilinca yukaridaki DB_* degerleri
      # kullanilir, host'ta tanimliysa o kazanir.
      - DATABASE_URL=${DATABASE_URL:-}
      # Bare passthrough, not JWT_SECRET=${JWT_SECRET:-}: the ":-" form sets the
      # variable to an empty string when the host has none, and dotenv will not
      # overwrite an already-set variable, so the value in backend/.env would be
      # ignored and every token signature would fail.
      - JWT_SECRET
      # S3 ayarlari: host ortaminda tanimliysa aktarilir, tanimli degilse
      # volume ile baglanan backend/.env dosyasindan dotenv okur.
      - AWS_ACCESS_KEY_ID
      - AWS_SECRET_ACCESS_KEY
      - AWS_REGION
      - S3_BUCKET
      # Redis: tanimliysa Socket.IO adapter'i devreye girer ve backend birden
      # fazla surec olarak calistirilabilir. Tanimsizken tek surec modunda calisir.
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      # PostgreSQL havuz boyutu. Cok surecli kurulumda toplam baglanti
      # (surec sayisi x DB_POOL_MAX) PostgreSQL'in max_connections degerini
      # asmamalidir; bkz. src/db/pool.ts.
      - DB_POOL_MAX
      # Development-only limits. The e2e suite registers a fresh tenant for
      # almost every test, which legitimately exceeds the production
      # registration limit; without these overrides the suite fails with 429
      # rather than on anything it is actually asserting. Production keeps the
      # strict defaults in src/middleware/rateLimit.ts.
      - REGISTER_RATE_MAX=${REGISTER_RATE_MAX:-100000}
      - AUTH_RATE_MAX=${AUTH_RATE_MAX:-100000}
      - API_RATE_MAX=${API_RATE_MAX:-1000000}
      # Yerel model (vLLM, bkz. ai/README.md). Degerler yalnizca kok .env'den
      # gelir: burada acikca atandiklari icin backend/.env'deki bir AI satiri
      # etkisizdir. Eksik ya da hatali bir deger AI'yi kapatir, backend'i durdurmaz.
      - AI_ENABLED=${AI_ENABLED:-false}
      - AI_BASE_URL=${AI_BASE_URL:-http://llm:8000/v1}
      - AI_API_KEY=${AI_API_KEY:-}
      - AI_MODEL=${AI_MODEL:-}
      - AI_TIMEOUT_MS=${AI_TIMEOUT_MS:-20000}
      - AI_CONCURRENCY=${AI_CONCURRENCY:-2}
      - AI_QUEUE_MAX_WAIT_MS=${AI_QUEUE_MAX_WAIT_MS:-8000}
      - AI_AUTO_REPLY_ENABLED=${AI_AUTO_REPLY_ENABLED:-false}
      - ORDER_LOOKUP_TIMEOUT_MS=${ORDER_LOOKUP_TIMEOUT_MS:-3000}
    ports:
      - "${BACKEND_PORT:-5000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # The endpoint also reports database connectivity, so a backend that is
      # listening but cannot reach postgres is correctly reported unhealthy.
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  admin:
    build:
      context: ./admin-panel
      dockerfile: Dockerfile
    command: npm run dev -- --host 0.0.0.0 --port 5173
    working_dir: /usr/src/admin-panel
    volumes:
      - ./admin-panel:/usr/src/admin-panel
      - admin_node_modules:/usr/src/admin-panel/node_modules
    environment:
      NODE_ENV: development
      # Browser-side value, so it must point at the host port the backend is
      # published on, not at the compose service name.
      VITE_API_URL: "http://localhost:${BACKEND_PORT:-5000}"
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "${ADMIN_PORT:-5173}:5173"
    depends_on:
      - backend
    restart: unless-stopped

  proxy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "${PROXY_PORT:-80}:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - admin
      - backend

  # The self-hosted model (ai/README.md). Started only with the `ai` profile —
  # COMPOSE_PROFILES=ai in the root .env — so `docker compose up` on a machine
  # without a GPU brings up the app exactly as before, AI off. The backend does
  # not depend on it: chat and the inbox work while it loads or is stopped.
  llm:
    image: ${VLLM_IMAGE:-vllm/vllm-openai:v0.30.0@sha256:8a69ffad015f138d7170c4ddc429e230a3bc1c1719f67e14324749df200a4b90}
    profiles: [ai]
    restart: unless-stopped
    # vLLM starts without authentication when its key is empty. The ${:?}
    # form cannot be used here: compose checks it even with the profile off,
    # which would break `docker compose up` for everyone without AI.
    entrypoint:
      - /bin/sh
      - -c
      - 'if [ $${#VLLM_API_KEY} -lt 32 ]; then echo "AI_API_KEY must be at least 32 characters" >&2; exit 1; fi; exec vllm serve "$$@"'
      - --
    environment:
      VLLM_API_KEY: ${AI_API_KEY:-}
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      VLLM_NO_USAGE_STATS: "1"
      DO_NOT_TRACK: "1"
    # 4-bit weights, a 4096-token context and at most four sequences keep the
    # 12B model inside a 12–16 GB card (plan §2). Request logging is off by
    # default in this vLLM version, so prompts and answers never reach its log.
    command:
      - /models/${AI_MODEL:-unset}
      - --served-model-name
      - ${AI_MODEL:-unset}
      - --quantization
      - bitsandbytes
      - --dtype
      - bfloat16
      - --max-model-len
      - "4096"
      - --max-num-seqs
      - "4"
      - --gpu-memory-utilization
      - "0.85"
      - --limit-mm-per-prompt
      - '{"image": 0}'
      - --generation-config
      - vllm
    volumes:
      - supportio_models:/models:ro
    ports:
      # Development only, and only on this machine; production has no port.
      - "127.0.0.1:8000:8000"
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10m

  # One-off: `npm run ai:download`. Same image as the server, so no Python
  # image of our own; the only step that talks to Hugging Face.
  model-download:
    image: ${VLLM_IMAGE:-vllm/vllm-openai:v0.30.0@sha256:8a69ffad015f138d7170c4ddc429e230a3bc1c1719f67e14324749df200a4b90}
    profiles: [ai-tools]
    entrypoint: ["python3", "/ai/download.py"]
    environment:
      AI_MODEL_REVISION: ${AI_MODEL_REVISION:-}
      HF_TOKEN: ${HF_TOKEN:-}
      HF_HUB_DISABLE_TELEMETRY: "1"
      DO_NOT_TRACK: "1"
    volumes:
      - supportio_models:/models
      - ./ai/download.py:/ai/download.py:ro

volumes:
  supportio_models:
  postgres_data:
  redis_data:
  backend_node_modules:
  admin_node_modules:
