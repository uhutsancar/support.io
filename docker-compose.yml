version: '3.8'

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${DB_NAME:-supportchat}
      POSTGRES_USER: ${DB_USER:-support_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-supportchat}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-support_user} -d ${DB_NAME:-supportchat}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    # wait for postgres to accept connections before starting nodemon
    command: sh -c "until nc -z postgres 5432; do echo waiting for postgres; sleep 1; done; ./node_modules/.bin/nodemon src/server.js"
    working_dir: /usr/src/backend
    volumes:
      - ./backend:/usr/src/backend
      - backend_node_modules:/usr/src/backend/node_modules
      - ./uploads:/usr/src/backend/uploads
    environment:
      - PORT=3000
      - NODE_ENV=development
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-supportchat}
      - DB_USER=${DB_USER:-support_user}
      - DB_PASSWORD=${DB_PASSWORD:-supportchat}
      - DB_SSL=false
      # backend/.env icindeki DATABASE_URL localhost'u gosterir; konteyner
      # icinde bu yanlis olur. Bos birakilinca yukaridaki DB_* degerleri
      # kullanilir, host'ta tanimliysa o kazanir.
      - DATABASE_URL=${DATABASE_URL:-}
      # S3 ayarlari: host ortaminda tanimliysa aktarilir, tanimli degilse
      # volume ile baglanan backend/.env dosyasindan dotenv okur.
      - AWS_ACCESS_KEY_ID
      - AWS_SECRET_ACCESS_KEY
      - AWS_REGION
      - S3_BUCKET
    ports:
      - "5000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  admin:
    build:
      context: ./admin-panel
      dockerfile: Dockerfile
    command: npm run dev -- --host 0.0.0.0 --port 5173
    working_dir: /usr/src/admin-panel
    volumes:
      - ./admin-panel:/usr/src/admin-panel
      - admin_node_modules:/usr/src/admin-panel/node_modules
    environment:
      NODE_ENV: development
      VITE_API_URL: "http://localhost:5000"
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped

  proxy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - admin
      - backend

volumes:
  postgres_data:
  backend_node_modules:
  admin_node_modules:
